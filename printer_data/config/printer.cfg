y_offset: -0.75
#tap_adjust_z: 0.090
tap_target_z: -1.000
tap_samples: 5
tap_max_samples: 10
tap_threshold: 350
debug: false
write_tap_plot: false
write_every_tap_plot: false

#[z_offset_calibration] #SOVOL SAVE
