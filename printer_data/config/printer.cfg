[filament_switch_sensor filament_sensor]
pause_on_runout: False
switch_pin: PB2
runout_gcode:
    M117 Out of Filament
    CONTINUE_PRINT_D D={200}

[filament_motion_sensor filament_motion]
detection_length: 15.0
#   The minimum length of filament pulled through the sensor to trigger
#   a state change on the switch_pin
#   Default is 7 mm.
extruder: extruder
#   The name of the extruder or extruder_stepper section this sensor
#   is associated with. This parameter must be provided.
switch_pin: PE7
pause_on_runout: False
runout_gcode:
    RESPOND PREFIX=filament_motion MSG="FILAMENT NOT DETECTED (motion sensor)"

insert_gcode:
