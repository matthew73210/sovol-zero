[include fluidd.cfg]
[include KAMP_Settings.cfg]
[include autotune_tmc.cfg]
[include chamber_hot.cfg]
[include steppers_config.cfg]


[virtual_sdcard]
path: /home/sovol/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[mcu] 
#canbus_uuid: 0d1445047cdd  #SOVOL SAVE
canbus_uuid: 69cd41686193

[mcu extruder_mcu]
#canbus_uuid: 61755fe321ac #SOVOL SAVE
canbus_uuid: 3625e7a7af55

[lis2dw]
cs_pin: extruder_mcu:PB12
spi_software_sclk_pin: extruder_mcu:PB13
spi_software_mosi_pin: extruder_mcu:PB15
spi_software_miso_pin: extruder_mcu:PB14
axes_map: x,z,y

[exclude_object]

[skew_correction]

[gcode_arcs]
resolution: 1.0

[resonance_tester]
accel_chip: lis2dw
probe_points:
    76, 76, 30  
accel_per_hz: 75
min_freq: 1
max_freq: 200
max_smoothing: 0.25
hz_per_sec: 1

[temperature_sensor mcu_temp]         
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor Host_temp]     
sensor_type: temperature_host
min_temp: 0
max_temp: 100

#[temperature_sensor Toolhead_Temp]
#sensor_type: temperature_mcu
#sensor_mcu: extruder_mcu

[printer]
kinematics: corexy
max_velocity: 600           
max_accel: 15500             
minimum_cruise_ratio: 0.5    
max_z_velocity: 20           
max_z_accel: 500             
square_corner_velocity: 3.0  

[input_shaper]
#shaper_type_x: mzv
#shaper_freq_x: 64
damping_ratio_x: 0.058
#shaper_type_y: mzv
#shaper_freq_y: 48.4
damping_ratio_y: 0.056

#[probe_eddy_current eddy]
