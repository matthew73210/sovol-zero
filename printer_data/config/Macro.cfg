
[gcode_macro mainled_on]
gcode:
    SET_PIN PIN=main_led VALUE=1

[gcode_macro mainled_off]
gcode:
    SET_PIN PIN=main_led VALUE=0

[gcode_macro ALL_FAN_OFF]
gcode:
  M107
  SET_FAN_SPEED FAN=bed SPEED=0
  SET_TEMPERATURE_FAN_TARGET temperature_fan=exhaust_fan target=0

[gcode_macro CLEAN_NOZZLE] 
gcode:
    BED_MESH_CLEAR
    G90 
    G1 X-9.2 Y5.6 Z10 F9000
    M109 S200
    G4 P100 # pause 100ms?
    M400 # wait for moves
    G1 Z-2 F9000

    M104 S130                          ; START cooling to 130C now (don't wait)
    M106 S255                          ; Part fan on to speed up cooling/harden ooze

    G1 Y45 F2400
    G1 X-8.2 Y5.6
    G1 Y45 
    G1 X-8.2 Y5.6
    G1 Y38
    G1 X-9.2 Y5.6
    G1 Y38
    G1 X-9.5 Y5.6
    G1 Y33 
    G1 X-8.2 Y5.6
    G1 Y33 
    G1 X-8.2 Y5.6
    G1 Y28
    G1 X-9.2 Y5.6
    G1 Y28
    G1 X-9.2 Y5.6
    G1 Z5
    M106 S255
    M109 S130
    M106 S0
    G1 Z5

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_BASE
gcode:
    {% set v0 = printer.toolhead.max_velocity|float %}
    {% set a0 = printer.toolhead.max_accel|float %}
    {% set scv0 = printer.toolhead.square_corner_velocity|float %}

    # Temporary "quiet" limits for mesh scanning
    {% set v_mesh = 400 %}      # mm/s
    {% set a_mesh = 1000.0 %}     # mm/s^2
    {% set scv_mesh = 1.0 %}      # mm/s

    SET_VELOCITY_LIMIT VELOCITY={v_mesh} ACCEL={a_mesh} SQUARE_CORNER_VELOCITY={scv_mesh}
    #BED_MESH_CALIBRATE_BASE ADAPTIVE=1 PGP=1 METHOD=rapid_scan
    EDDYNG_BED_MESH_EXPERIMENTAL
    SET_VELOCITY_LIMIT VELOCITY={v0} ACCEL={a0} SQUARE_CORNER_VELOCITY={scv0}

[gcode_macro START_PRINT]
gcode:
    {% set BED = params.BED|float %}
    {% set EXTRUDER = params.EXTRUDER|float %}
    CLEAR_PAUSE
    SET_SKEW CLEAR=1

    M140 S{BED}
    M104 S130

    G28

    M117 Clean Nozzle
    CLEAN_NOZZLE

    
    M190 S{BED}

    M117 Tippy tap
    G1 X75 Y75 Z2
    PROBE_EDDY_NG_TAP
    
    M117 Bed Meshing
    BED_MESH_CALIBRATE

    G1 X1 Y1 Z0.1

    #For MPC
    RESPOND TYPE=command MSG="Heating extruder and setting MPC filament, clean nozzle."
    _SET_MPC_MATERIAL MATERIAL={params.MATERIAL}
    #SET_HEATER_TEMPERATURE HEATER=extruder TARGET={EXTRUDER_TEMP}
    #TEMPERATURE_WAIT SENSOR="extruder" MINIMUM={EXTRUDER_TEMP}

    # only now: go to actual print temp and wait
    M109 S{EXTRUDER}
    G1 X1 Y1 Z5
    LINE_PURGE
    #SKEW_PROFILE LOAD=Calilantern
    G90
    M83
    
[gcode_macro END_PRINT]
gcode:
    {% set z_max = printer.toolhead.axis_maximum.z|float %}
    {% set e_mintemp = printer.configfile.settings['extruder'].min_extrude_temp %}

    M117 Finish Print!!!

    {% if printer.toolhead.homed_axes|lower == "xyz" %}
        G91

        {% if printer['filament_switch_sensor filament_sensor'].enabled
              and printer['filament_switch_sensor filament_sensor'].filament_detected %}
            {% if printer.extruder.target != 0
                  and printer.extruder.temperature >= printer.extruder.target
                  and printer.extruder.temperature >= e_mintemp %}
                M83
                G1 E-2 F2700
                G1 E-2 Z0.2 F2400
            {% endif %}
        {% endif %}

        {% if (printer.gcode_move.position.z + 10) < z_max %}
            G1 Z10 F3000
        {% else %}
            G1 Z{z_max - printer.gcode_move.position.z} F3000
        {% endif %}

        G90
    {% endif %}

    ALL_FAN_OFF
    TURN_OFF_HEATERS
    M220 S100
    M221 S100
    CLEAR_PAUSE
    M84 X Y Z E

[gcode_macro M109]
rename_existing: M99109
gcode:    
    {% set s = params.S|float %}    
    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}  
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s-2} MAXIMUM={s+2}   
    {% endif %}
    
[gcode_macro M190]

rename_existing: M99190
gcode:    
    {% set s = params.S|float %}
    M140 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}   
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={s-2} MAXIMUM={s+2}  
    {% endif %}


  
[gcode_macro M600]
gcode:
    PAUSE STATE=filament_change

[gcode_macro G28]
rename_existing: M9928
gcode:
    {% if params.X is defined or params.Y is defined or params.Z is defined %}
        # If caller specified any axes, behave like stock G28 for those axes
        M9928 {rawparams}
    {% else %}
        # Plain G28: do XY first, move to a known-metal point, then Z
        M9928 X
        M9928 Y
        G90
        G0 X75 Y75 F5000
        M9928 Z
    {% endif %}

[gcode_macro M106]
rename_existing = M106.1
gcode = 
    {% set p = params.P|default(0)|int %}
    {% set s255 = params.S|default(255)|int %}
    {% set s = (s255 / 255.0) %}
    {% if p == 0 %}
        M106.1 S{s255}
    {% elif p == 2 %}
        SET_FAN_SPEED FAN=bed SPEED={s}
    {% elif p == 3 %}
        {% if s > 0 %}
            SET_TEMPERATURE_FAN_TARGET temperature_fan=exhaust_fan target=35
        {% else %}
            SET_TEMPERATURE_FAN_TARGET temperature_fan=exhaust_fan target=80
        {% endif %}
    {% else %}
        M106.1 S{s255}
    {% endif %}

[gcode_macro M107]
rename_existing = M107.1
gcode = 
    {% set p = params.P|default(0)|int %}
    {% if p == 0 %}
        M107.1
    {% elif p == 2 %}
        SET_FAN_SPEED FAN=bed SPEED=0
    {% elif p == 3 %}
        SET_TEMPERATURE_FAN_TARGET temperature_fan=exhaust_fan target=80
    {% else %}
        M107.1
    {% endif %}

[gcode_macro _SET_MPC_MATERIAL]
description: Set heater MPC parameters for a given material
variable_filament_table:
    ## Update this table to adjust material settings
    {
        ## ( density, heat capacity )  # suggested heat capacity range
        "PLA"       : ( 1.25, 2.20 ),  # 1.80 - 2.20
        "PETG"      : ( 1.27, 2.20 ),  # 1.70 - 2.20
        "PC+ABS"    : ( 1.15, 2.20 ),  # 1.50 - 2.20
        "ABS"       : ( 1.06, 2.40 ),  # 1.25 - 2.40
        "ASA"       : ( 1.07, 2.10 ),  # 1.30 - 2.10
        "PA6"       : ( 1.12, 2.50 ),  # 2.00 - 2.50
        "PA"        : ( 1.15, 2.50 ),  # 2.00 - 2.50
        "PC"        : ( 1.20, 1.90 ),  # 1.10 - 1.90
        "TPU"       : ( 1.21, 2.00 ),  # 1.50 - 2.00
        "TPU-90A"   : ( 1.15, 2.00 ),  # 1.50 - 2.00
        "TPU-95A"   : ( 1.22, 2.00 ),  # 1.50 - 2.00
        "ABS-CF"    : ( 1.11, 2.40 ),  # 1.25 - 2.40
        "ASA-CF"    : ( 1.11, 2.10 ),  # 1.30 - 2.10
        "PA6-CF"    : ( 1.19, 2.50 ),  # 2.00 - 2.50
        "PC+ABS-CF" : ( 1.22, 2.20 ),  # 1.50 - 2.20
        "PC+CF"     : ( 1.36, 1.90 ),  # 1.10 - 1.90
        "PLA-CF"    : ( 1.29, 2.20 ),  # 1.80 - 2.20
        "PETG-CF"   : ( 1.30, 2.20 ),  # 1.70 - 2.20
    }
gcode:
    {% set material = params.MATERIAL | upper %}
    {% set heater = params.HEATER | default('extruder') %}
    {% set extruder_config = printer.configfile.settings[heater] %}

    {% if material in filament_table %}
        {% set (density, heat_capacity) = filament_table[material] %}

        RESPOND PREFIX=🔥 MSG="Configured {heater} MPC for {material}. Density: {density}, Heat Capacity: {heat_capacity}"
    {% else %}
        {% set density = extruder_config.filament_density %}
        {% set heat_capacity=extruder_config.filament_heat_capacity %}

        RESPOND PREFIX=🔥 MSG="Unknown material '{material}', using default mpc parameters for {heater}"
    {% endif %}

    MPC_SET HEATER={heater} FILAMENT_DENSITY={density} FILAMENT_HEAT_CAPACITY={heat_capacity}